name: CI

# Version branches (4.7.0, 4.8.0, ...) are where the work happens, and they were
# previously untested: the old triggers listed only main/master, so no release
# branch ever ran CI. Run on every branch and every PR instead.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none

      - name: Check PHP syntax
        run: |
          find . -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./node_modules/*" \
            -not -path "./.phpstan-stubs/*" \
            -print0 | xargs -0 -n1 -P4 php -l

  wpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # The codebase carries 216 pre-existing violations under phpcs.xml.dist.
      # Rather than bulk-reformat 105 files (which would destroy git blame and
      # change semantics on 243 loose comparisons), the gate is scoped to files
      # this branch actually touched. New and modified code must be clean.
      - name: Determine changed PHP files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            git fetch --no-tags --depth=50 origin master 2>/dev/null \
              || git fetch --no-tags --depth=50 origin main 2>/dev/null || true
            BASE="$(git merge-base HEAD FETCH_HEAD 2>/dev/null || echo '')"
          fi

          if [ -z "$BASE" ]; then
            echo "No merge base found - falling back to the last commit."
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi

          git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.php' \
            | grep -Ev '^(vendor|node_modules|build|dist)/' > changed.txt || true

          echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "Changed PHP files:"; cat changed.txt

      # Errors block; warnings stay advisory. Touching a legacy file should not
      # fail the build over equals-sign alignment - that is how teams learn to
      # ignore gates. Security sniffs are errors (EscapeOutput natively,
      # NonceVerification promoted in phpcs.xml.dist), so they still block.
      - name: Run PHPCS on changed files (blocking, errors only)
        if: steps.changed.outputs.count != '0'
        run: tr "\\n" "\\0" < changed.txt | xargs -0 vendor/bin/phpcs -n --report=full

      - name: Full-tree PHPCS report (advisory)
        if: always()
        continue-on-error: true
        run: vendor/bin/phpcs --report=summary || true

  phpstan:
    name: PHPStan (level 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Elementor has no stubs package; 43 widgets extend its classes.
      - name: Fetch analysis-only sources
        run: bash bin/phpstan-fetch-deps.sh

      # Blocking. phpstan-baseline.neon grandfathers the 323 errors that existed
      # when the gate was introduced; anything new fails the build.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G --error-format=github

  security-audit:
    name: Composer security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Two high-severity advisories (CVE-2026-67434, CVE-2026-45293) shipped in
      # the dev toolchain undetected before this job existed.
      - name: Audit
        run: composer audit --no-interaction
